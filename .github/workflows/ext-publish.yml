name: Publish Extension

on:
  release:
    types: [created]

permissions:
  id-token: write
  contents: read

jobs:
  publish-ext:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx @vscode/vsce publish --oidc
